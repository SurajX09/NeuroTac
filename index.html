<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Tic Tac Toe AI 🎮</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{
display:flex;
justify-content:center;
align-items:center;
height:100vh;
background:linear-gradient(135deg,#1e3c12,#2a5298);
color:#fff;
}
.container{text-align:center}
h1{margin-bottom:20px}
#board{
display:grid;
grid-template-columns:repeat(3,100px);
grid-gap:10px;
justify-content:center;
margin:auto;
}
.cell{
width:100px;
height:100px;
background:#ffffff22;
border-radius:15px;
display:flex;
justify-content:center;
align-items:center;
font-size:50px;
cursor:pointer;
transition:.2s;
}
.cell:hover{background:#ffffff44}
button{
margin-top:20px;
padding:10px 25px;
font-size:18px;
border:none;
border-radius:8px;
cursor:pointer;
background:#00d084;
color:white;
}
#status{margin-top:15px;font-size:22px}
</style>
</head>
<body>

<div class="container">
<h1>❌ Tic Tac Toe ⭕</h1>

<div id="board"></div>

<div id="status">Your Turn (X)</div>

<button onclick="resetGame()">Restart</button>

</div>

<script>
const board=document.getElementById("board");
const status=document.getElementById("status");

let cells=["","","","","","","","",""];
let gameOver=false;

for(let i=0;i<9;i++){
let c=document.createElement("div");
c.className="cell";
c.dataset.i=i;
c.onclick=playerMove;
board.appendChild(c);
}

function playerMove(){
let i=this.dataset.i;
if(cells[i]||gameOver)return;
cells[i]="X";
draw();
if(check("X")){
status.innerHTML="🎉 You Win!";
gameOver=true;
return;
}
if(full()){
status.innerHTML="🤝 Draw";
gameOver=true;
return;
}
aiMove();
}

function aiMove(){
let best=-Infinity,move;

for(let i=0;i<9;i++){
if(cells[i]==""){
cells[i]="O";
let score=minimax(cells,false);
cells[i]="";
if(score>best){
best=score;
move=i;
}
}
}

cells[move]="O";
draw();

if(check("O")){
status.innerHTML="🤖 AI Wins";
gameOver=true;
return;
}

if(full()){
status.innerHTML="🤝 Draw";
gameOver=true;
return;
}

status.innerHTML="Your Turn (X)";
}

function minimax(b,isMax){

if(check("O"))return 1;
if(check("X"))return -1;
if(full())return 0;

if(isMax){
let best=-Infinity;
for(let i=0;i<9;i++){
if(b[i]==""){
b[i]="O";
best=Math.max(best,minimax(b,false));
b[i]="";
}
}
return best;
}else{
let best=Infinity;
for(let i=0;i<9;i++){
if(b[i]==""){
b[i]="X";
best=Math.min(best,minimax(b,true));
b[i]="";
}
}
return best;
}
}

function check(p){
const w=[
[0,1,2],[3,4,5],[6,7,8],
[0,3,6],[1,4,7],[2,5,8],
[0,4,8],[2,4,6]
];
return w.some(a=>a.every(i=>cells[i]==p));
}

function full(){
return cells.every(c=>c!="");
}

function draw(){
document.querySelectorAll(".cell").forEach((c,i)=>{
c.innerHTML=cells[i];
});
}

function resetGame(){
cells=["","","","","","","","",""];
gameOver=false;
draw();
status.innerHTML="Your Turn (X)";
}
</script>

</body>
</html>
